<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curvature / Tensor Viewer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f3efe6' stroke='%23666'/%3E%3Cpath d='M8 16h16M16 8v16' stroke='%23e91e63'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div class="top-controls">
      <select id="sample-select" class="ctrl-select"></select>
      <select id="curvature-mode" class="ctrl-select">
        <option value="mean">Mean Curvature</option>
        <option value="max">Max Principal Curvature</option>
        <option value="min">Min Principal Curvature</option>
      </select>
      <label class="ctrl-btn" for="file-input">Upload PLY</label>
      <input id="file-input" type="file" accept=".ply" hidden />
    </div>

    <div id="status" class="status" hidden>
      <div class="status-text">Loading mesh…</div>
    </div>

    <main class="viewer-wrap">
      <canvas id="canvas"></canvas>

      <div id="compare-slider" class="compare-slider" style="left: 50%">
        <div id="compare-handle" class="compare-handle" title="Drag to compare">← →</div>
        <div class="compare-labels">
          <span class="compare-label left">← 3D Curvature</span>
          <span class="compare-label right">Tensor Field →</span>
        </div>
      </div>
    </main>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three.module.js",
      "three/addons/": "/vendor/"
    }
  }
  </script>
  <script>
    window.addEventListener("error", (event) => {
      const tag = event.target?.tagName;
      if (tag && tag !== "SCRIPT") return;
      if (!event.message && !event.error) return;
      const status = document.getElementById("status");
      const text = status?.querySelector(".status-text");
      if (!status || !text) return;
      text.textContent = event.message || "Failed to load viewer.";
      status.classList.add("error");
      status.hidden = false;
    });
    window.addEventListener("unhandledrejection", (event) => {
      const status = document.getElementById("status");
      const text = status?.querySelector(".status-text");
      if (!status || !text) return;
      text.textContent = event.reason?.message || String(event.reason || "Failed to load viewer.");
      status.classList.add("error");
      status.hidden = false;
    });
  </script>
  <script type="module" src="viewer.js?v=11"></script>
</body>
</html>
